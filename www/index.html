<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Load Cell</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script type="module" src="main.js"></script>
    <style>
        :root {
            font-size: 62.5%;
            --grayscale-50: #f8f8f8;
            --grayscale-100: #eaeaea;
            --grayscale-200: #d8d8d8;
            --grayscale-300: #bababa;
            --grayscale-400: #aaaaaa;
            --grayscale-500: #9b9b9b;
            --grayscale-600: #666666;
            --grayscale-700: #565656;
            --grayscale-800: #474747;
            --grayscale-900: #2d2d2d;
            --grayscale-1000: #1e1e1e;
            --grayscale-1100: #101010;
            }
        body {
            font-family: monospace;
            font-size: 1.8rem;
            line-height: 1.6;
            max-width: 38em;
            margin: auto;
            color: var(--grayscale-200);
            background-color: var(--grayscale-1100);
        }
        input,
        textarea,
        select {
            font-family: monospace;
            font-size: 90%;
            color: var(--grayscale-300);
            background-color: var(--grayscale-1100);
            border: 1px solid var(--grayscale-900);
        }
        input:focus {
            outline: none;
            color: var(--grayscale-200);
            background-color: var(--grayscale-1000);
            border-color: var(--grayscale-800);
        }
        button {
            font-family: monospace;
            font-size: 90%;
            color: var(--grayscale-200);
            background-color: var(--grayscale-1000);
            border: 1px solid var(--grayscale-800);
        }
        button:hover {
            color: var(--grayscale-100);
            background-color: var(--grayscale-900);
            border-color: var(--grayscale-700);
        }
    </style>
</head>
<body>
    <div id="nav">
        <input type="button" value="Data" id="nav-data-tab-show"/><input type="button" value="Calibration" id="nav-calibration-tab-show"/><input type="button" value="Settings" id="nav-settings-tab-show"/>
    </div>

    <div id="data-tab">
        <svg id="data-graph" width="100%" viewBox="0 -5 240 120" style="font-size: 0.5rem">
            <g transform="translate(0, 110) scale(1, -1)">
                <line x1="0%" x2="100%" y1="0" y2="0" stroke="gray" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="10" y2="10" stroke="gray" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="20" y2="20" stroke="gray" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="30" y2="30" stroke="gray" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="40" y2="40" stroke="gray" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="50" y2="50" stroke="gray" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="60" y2="60" stroke="gray" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="70" y2="70" stroke="gray" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="80" y2="80" stroke="gray" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="90" y2="90" stroke="gray" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="100" y2="100" stroke="gray" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
                <line x1="0%" x2="100%" y1="110" y2="110" stroke="gray" stroke-width="0.25" vector-effect="non-scaling-stroke"/>

                <polyline id="data-graph-trace" stroke="blue" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/>

                <line id="data-graph-max-line" x1="0%" x2="100%" y1="0" y2="0" stroke="red" stroke-width="1" vector-effect="non-scaling-stroke"/>
                <line id="data-graph-current-line" x1="0%" x2="100%" y1="0" y2="0" stroke="yellow" stroke-width="1" vector-effect="non-scaling-stroke"/>

                <g transform="scale(1, -1)">
                    <text x="0%" y="-1"  fill="gray"> 0</text>
                    <text x="0%" y="-11" fill="gray">10</text>
                    <text x="0%" y="-21" fill="gray">20</text>
                    <text x="0%" y="-31" fill="gray">30</text>
                    <text x="0%" y="-41" fill="gray">40</text>
                    <text x="0%" y="-51" fill="gray">50</text>
                    <text x="0%" y="-61" fill="gray">60</text>
                    <text x="0%" y="-71" fill="gray">70</text>
                    <text x="0%" y="-81" fill="gray">80</text>
                    <text x="0%" y="-91" fill="gray">90</text>
                    <text x="0%" y="-101" fill="gray">100</text>
                    <text id="data-graph-max" x="50%" y="-1" text-anchor="middle" fill="red">0.0</text>
                    <text id="data-graph-current" x="50%" y="-1" text-anchor="middle" fill="yellow">0.0</text>
                </g>

            </g>
        </svg>
        <span>Current </span><pre id="data-current" style="display:inline"> 00.00</pre>
        <span>Max </span><pre id="data-max" style="display:inline"> 00.00</pre>
        <button id="data-max-reset">Reset</button>
    </div>

    <div id="calibration-tab" style="display:none">
        <div><label for="calibration-offset">Offset:</label><input type="number" id="calibration-offset"/></div>
        <div><label for="calibration-scale">Scale: </label><input type="number" id="calibration-scale"/></div>
        <div><input type="button" value="Apply" id="calibration-apply"/> <input type="button" value="Reset" id="calibration-reset"/></div>
    </div>

    <div id="settings-tab" style="display:none">
        <form action="/settings" method="post" id="settings">
            <div><label for="settings-ap-ssid">AP SSID: </label><input type="text" name="ap_ssid" id="settings-ap-ssid" required/></div>
            <div><label for="settings-ap-pass">AP Pass: </label><input type="password" name="ap_pass" id="settings-ap-pass"/></div>
            <div><label for="settings-st-ssid">ST SSID: </label><input type="text" name="st_ssid" id="settings-st-ssid" required/></div>
            <div><label for="settings-st-pass">ST Pass: </label><input type="password" name="st_pass" id="settings-st-pass"/></div>
            <div><label for="settings-wifi-power">WiFi Db: </label><input type="number" min="0" max="82" name="wifi_power" id="settings-wifi-power" required/></div>
            <div><input type="submit" value="Apply"/> <input type="button" value="Reset" id="settings-reset"/></div>
        </form>
        <div>Firmware Version: <span id="firware-version">0.0</span></div>
        <div>Chip Vcc: <span id="chip-vcc">0.00v</span></div>
        <input type="file" accept=".bin" id="firmware-update-file" style="display:none"/><input type="button" value="Upload Firmware" id="firmware-update"/>
        <span id="firmware-update-status"></span>
    </div>
</body>
</html>
